name: Publish an owner-authorized free beta profile
on:
  workflow_dispatch:
    inputs:
      partner_lead_id:
        description: Existing qualified beta application UUID
        required: true
        type: string
      confirmation:
        description: Type PUBLISH_FREE_BETA; no charge or paid conversion
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: homeofferflow-beta-publication
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_FREE_BETA' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the existing pinned HTTP client
        run: python -m pip install httpx==0.27.0
      - name: Publish only this no-charge beta profile
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PARTNER_LEAD_ID: ${{ inputs.partner_lead_id }}
          BETA_CONFIRMATION: ${{ inputs.confirmation }}
        run: python scripts/publish_free_beta_partner.py
