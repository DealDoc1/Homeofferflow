name: HomeOfferFlow controlled purchase signing check

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: QA_ONLY sends one test; AUTH_CHECK only reads an existing QA document
        required: true
        type: string
      release_sha:
        description: Exact production revision whose unchanged source is being checked
        required: true
        type: string
      layout_sha256:
        description: Fingerprint of the locally visually reviewed layout and signing fields
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: purchase-signing-qa-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.ref == 'refs/heads/main' && (inputs.confirmation == 'QA_ONLY' || inputs.confirmation == 'AUTH_CHECK') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PYTHONPATH: .
      QA_RELEASE_SHA: ${{ inputs.release_sha }}
      QA_LAYOUT_SHA: ${{ inputs.layout_sha256 }}
      QA_ATTEMPT_NAME: purchase-signing-attempt-${{ inputs.release_sha }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an existing runner credential without exporting production Secrets
        env:
          SIGNWELL_API_KEY: ${{ secrets.SIGNWELL_API_KEY }}
        run: |
          python - <<'PY'
          import os
          key = os.environ.get('SIGNWELL_API_KEY', '').strip()
          if not key:
              raise SystemExit('No existing SignWell credential is available to this runner. Production Secrets stay protected; nothing sent. Use an authenticated provider-side QA path.')
          assert os.environ['VERCEL_PROJECT_ID'] == 'prj_LupoeEEcWigvtw6CII2bL46l0RB3'
          assert os.environ['VERCEL_ORG_ID'] == 'team_BZUBDsoLMwlnaXtIES35YT4S'
          print('Existing QA runner credential and HomeOfferFlow target are present; no value displayed.')
          PY
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned test dependencies
        run: python -m pip install --requirement requirements-test.txt
      - name: Verify reviewed specimen and unchanged deployed generator
        if: ${{ inputs.confirmation == 'QA_ONLY' }}
        run: python -m scripts.qa.purchase_signing_check --output-dir tmp/controlled-purchase-qa --release-sha "$QA_RELEASE_SHA" --expected-layout-sha256 "$QA_LAYOUT_SHA"
      - name: Preserve the synthetic unsigned review specimen
        if: ${{ inputs.confirmation == 'QA_ONLY' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: purchase-signing-review-${{ inputs.release_sha }}
          retention-days: 7
          path: |
            tmp/controlled-purchase-qa/unsigned.pdf
            tmp/controlled-purchase-qa/manifest.json
      - name: Confirm an existing SignWell credential is available
        env:
          SIGNWELL_API_KEY: ${{ secrets.SIGNWELL_API_KEY }}
        run: python -m scripts.qa.purchase_signing_check --output-dir tmp/controlled-purchase-qa --release-sha "$QA_RELEASE_SHA" --check-key
      - name: Refuse a duplicate controlled test attempt
        if: ${{ inputs.confirmation == 'QA_ONLY' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh api --paginate repos/DealDoc1/Homeofferflow/actions/artifacts --jq '.artifacts[] | select(.name == env.QA_ATTEMPT_NAME) | .id')
          test -z "$previous" || { echo "An earlier attempt is recorded. Inspect its receipt and SignWell instead of resending."; exit 1; }
      - name: Record the attempt before the provider call
        if: ${{ inputs.confirmation == 'QA_ONLY' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.QA_ATTEMPT_NAME }}
          retention-days: 90
          path: tmp/controlled-purchase-qa/manifest.json
      - name: Send exactly one nonbinding parallel test
        if: ${{ inputs.confirmation == 'QA_ONLY' }}
        env:
          SIGNWELL_API_KEY: ${{ secrets.SIGNWELL_API_KEY }}
        run: python -m scripts.qa.purchase_signing_check --output-dir tmp/controlled-purchase-qa --release-sha "$QA_RELEASE_SHA" --expected-layout-sha256 "$QA_LAYOUT_SHA" --send
      - name: Preserve only the safe receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: purchase-signing-receipt-${{ inputs.release_sha }}
          retention-days: 90
          if-no-files-found: ignore
          path: tmp/controlled-purchase-qa/receipt.json
      - name: Read-only credential decoding check
        if: ${{ inputs.confirmation == 'AUTH_CHECK' }}
        env:
          SIGNWELL_API_KEY: ${{ secrets.SIGNWELL_API_KEY }}
        run: python -m scripts.qa.purchase_signing_check --output-dir tmp/controlled-purchase-qa --release-sha "$QA_RELEASE_SHA" --diagnose-credential
      - name: Preserve only safe diagnostic metadata
        if: ${{ inputs.confirmation == 'AUTH_CHECK' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: purchase-signing-credential-check-${{ inputs.release_sha }}
          retention-days: 7
          path: tmp/controlled-purchase-qa/credential-check.json
