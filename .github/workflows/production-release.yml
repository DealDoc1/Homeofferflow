name: HomeOfferFlow intentional production release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to authorize the intentional production release
        required: true
        type: string
      base_ref:
        description: Git reference used for the release preflight comparison
        required: true
        default: origin/main
        type: string
      evidence_file:
        description: Completed release-evidence Markdown file when applicable
        required: false
        type: string
      expected_deploy_author_email:
        description: Commit author email permitted for the Vercel team
        required: true
        default: andrewchri@gmail.com
        type: string
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: homeofferflow-production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact release commit
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEPLOY') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned test dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run full regression suite
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -q

      - name: Check patch whitespace
        run: git diff --check "${{ inputs.base_ref || 'HEAD^' }}" "${{ github.sha }}"

      - name: Run fail-closed release preflight
        env:
          PYTHONPATH: .
        run: |
          args=(
            --base "${{ inputs.base_ref || 'HEAD^' }}"
            --expected-deploy-author-email "${{ inputs.expected_deploy_author_email || 'andrewchri@gmail.com' }}"
          )
          if [[ -n "${{ inputs.evidence_file }}" ]]; then
            args+=(--evidence-file "${{ inputs.evidence_file }}")
          fi
          python scripts/release_preflight.py "${args[@]}"

  deploy:
    name: Deploy complete prebuilt tree to Vercel production
    needs: verify
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEPLOY') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://www.homeofferflow.com/
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@57.0.0

      - name: Pull production Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=dealdoc1s-projects

      - name: Build the exact production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN" --scope=dealdoc1s-projects

      - name: Deploy the prebuilt artifact
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --scope=dealdoc1s-projects)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$url"

      - name: Verify deployment is ready
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel inspect "${{ steps.deploy.outputs.url }}" --token="$VERCEL_TOKEN" --scope=dealdoc1s-projects

      - name: Verify canonical site responds
        run: curl --fail --silent --show-error --location --max-time 30 https://www.homeofferflow.com/ > /dev/null

      - name: Record deployment boundary
        run: |
          echo "Intentional production deployment completed from ${GITHUB_SHA}."
          echo "Deployment URL: ${{ steps.deploy.outputs.url }}"
          echo "Post-deploy runtime comparison remains required."

  reject:
    name: Reject missing deployment confirmation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation != 'DEPLOY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed
        run: |
          echo "Type DEPLOY exactly in the confirmation input to authorize production deployment."
          exit 1
