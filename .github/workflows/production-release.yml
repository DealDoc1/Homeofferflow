name: HomeOfferFlow intentional production release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to authorize the intentional production release
        required: true
        type: string
      base_ref:
        description: Git reference used for the release preflight comparison
        required: true
        default: origin/main
        type: string
      evidence_file:
        description: Completed release-evidence Markdown file when applicable
        required: false
        type: string
      expected_deploy_author_email:
        description: Commit author email permitted for the Vercel team
        required: true
        default: andrewchri@gmail.com
        type: string
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: homeofferflow-production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact release commit
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEPLOY') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Run full regression suite
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -q

      - name: Check patch whitespace
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            base_ref="$(python scripts/release_base_ref.py)"
          else
            base_ref="${{ inputs.base_ref }}"
          fi
          echo "Release preflight base: ${base_ref}"
          git diff --check "${base_ref}" "${{ github.sha }}"

      - name: Run fail-closed release preflight
        env:
          PYTHONPATH: .
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            base_ref="$(python scripts/release_base_ref.py)"
            # The only permitted push-triggered deployment is an explicit
            # release-marker commit.  Its scope is still checked against the
            # last production marker, and the completed evidence for this
            # corrective TXR-1507 release is supplied to the same preflight
            # used by manual production runs.
            evidence_file="docs/release-evidence/txr-1507-placement-correction-release-2026-09-11.md"
          else
            base_ref="${{ inputs.base_ref }}"
            evidence_file="${{ inputs.evidence_file }}"
          fi
          args=(
            --base "${base_ref}"
            --expected-deploy-author-email "${{ inputs.expected_deploy_author_email || 'andrewchri@gmail.com' }}"
          )
          if [[ -n "${evidence_file}" ]]; then
            args+=(--evidence-file "${evidence_file}")
          fi
          python scripts/release_preflight.py "${args[@]}"

  deploy:
    name: Deploy complete prebuilt tree to Vercel production
    needs: verify
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEPLOY') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://www.homeofferflow.com/
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up uv for Vercel Python build
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@57.0.0

      - name: Require existing production target settings
        run: |
          test -n "$VERCEL_ORG_ID" || { echo "Production team is not configured"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Production project is not configured"; exit 1; }

      - name: Pull production Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=dealdoc1s-projects

      - name: Verify the existing production project
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          project = json.loads(Path('.vercel/project.json').read_text())
          assert os.environ['VERCEL_PROJECT_ID'], 'Production project is not configured'
          assert os.environ['VERCEL_ORG_ID'], 'Production team is not configured'
          assert project['projectId'] == os.environ['VERCEL_PROJECT_ID'], 'Wrong production project'
          assert project['orgId'] == os.environ['VERCEL_ORG_ID'], 'Wrong production team'
          print('Existing production project verified.')
          PY

      - name: Check Vercel deployment safety threshold
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python scripts/check_vercel_deployment_capacity.py

      - name: Build the exact production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN" --scope=dealdoc1s-projects

      - name: Deploy the prebuilt artifact
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # A deploy can wait on an upstream Vercel request without producing
          # output. Bound it so the release reports a diagnosable failure
          # instead of consuming the entire job timeout.
          url="$(timeout --foreground 8m vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --scope=dealdoc1s-projects)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$url"

      - name: Verify deployment is ready
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel inspect "${{ steps.deploy.outputs.url }}" --token="$VERCEL_TOKEN" --scope=dealdoc1s-projects

      - name: Verify canonical site responds
        run: curl --fail --silent --show-error --location --max-time 30 https://www.homeofferflow.com/ > /dev/null

      - name: Verify production PWA shell
        run: python scripts/check_production_pwa.py --origin https://www.homeofferflow.com

      - name: Verify production API and packet runtime
        run: python scripts/check_production_release.py --origin https://www.homeofferflow.com

      - name: Record deployment boundary
        run: |
          echo "Intentional production deployment completed from ${GITHUB_SHA}."
          echo "Deployment URL: ${{ steps.deploy.outputs.url }}"
          echo "Post-deploy runtime comparison remains required."

  reject:
    name: Reject missing deployment confirmation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation != 'DEPLOY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed
        run: |
          echo "Type DEPLOY exactly in the confirmation input to authorize production deployment."
          exit 1
