name: HomeOfferFlow tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned test dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -q

      - name: Install PDF rendering tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils

      - name: Check approved golden packet rendering
        env:
          PYTHONPATH: .
        run: python scripts/check_golden_packet_rendering.py --structural-only

      - name: Run Supabase branch preflight
        run: python scripts/preflight_supabase_branch.py

      - name: Check patch whitespace
        run: git diff --check
