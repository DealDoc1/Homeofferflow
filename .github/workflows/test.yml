name: HomeOfferFlow tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check committed patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "A valid committed comparison range is required."; exit 1;
          }
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -q

      - name: Install PDF rendering tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils

      - name: Check approved golden packet rendering
        env:
          PYTHONPATH: .
        run: python scripts/check_golden_packet_rendering.py --cross-platform

      - name: Check standalone TXR signer geometry
        env:
          PYTHONPATH: .
        run: python scripts/check_txr_signwell_geometry_baseline.py

      - name: Run Supabase branch preflight
        run: python scripts/preflight_supabase_branch.py
