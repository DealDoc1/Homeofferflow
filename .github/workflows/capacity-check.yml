name: HomeOfferFlow read-only capacity check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homeofferflow-read-only-capacity
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out reviewed protected main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
      - name: Install pinned billing-read CLI
        run: npm install --global vercel@57.0.0
      - name: Read deployment window and credit headroom
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python scripts/check_vercel_deployment_capacity.py
