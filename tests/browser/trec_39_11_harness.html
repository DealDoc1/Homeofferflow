<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TREC 39-11 interview browser QA</title>
  <script>
    // Use the real shared form styles so conditional labels behave exactly
    // as they do in the production page, without loading account scripts.
    window.hofBrowserQaStyles = fetch('/index.html').then(response => response.text()).then(html => {
      const production = new DOMParser().parseFromString(html, 'text/html');
      const base = Array.from(production.querySelectorAll('style')).find(style => style.textContent.includes('--navy: #0d1f35;'));
      const forms = production.getElementById('hof-txr1507-drafts-v1');
      if (!base || !forms) throw new Error('Production form styles are unavailable.');
      production.querySelectorAll('style').forEach(style => document.head.appendChild(style.cloneNode(true)));
    });
  </script>
</head>
<body>
  <main class="account-shell">
    <section id="accountPanelRelationships" class="account-panel active">
      <h2>Prepare transaction documents</h2>
    </section>
  </main>
  <script>
    window.hofAuth = {
      role: 'agent',
      session: { user: { id: 'browser-qa-agent' }, access_token: 'browser-qa-only' },
      authoritativeProfile: { role: 'agent' },
    };
    window.hofLoadApprovedBrokerageSource = async () => {
      await window.hofBrowserQaStyles;
      return {id:'11111111-1111-4111-8111-111111111111', form_code:'TREC-39-11'};
    };
    window.hofCustomerActionError = error => error.message;
    window.hofApprovedSourceStatusCopy = error => error.message;
    window.announceWorkspaceStatus = () => {};
    window.renderAccountDashboard = () => {};
  </script>
  <script src="/assets/trec-39-11-amendment.js"></script>
</body>
</html>
